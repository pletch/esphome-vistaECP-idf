#########################################################################
# Zone text sensors can be specified to include alternative zone status as 
# a text sensor using type: zone. Output values: (O=open, B=bypass,T=trbl or check,A=alarm)
# Other general text sensors are available.
# type:
#    lrr_messages = long range radio messages
#    rf_messages = rf messages
#    line1 = keypad prompt line 1 displayed messages
#    line2 = keypad prompt line 2 displayed messages
#    zone_status = combined status for zones with messages
#    beeps = beeps output
# 
# Text sensors with partition specific data will require specifying partition:
#### text sensors ####
text_sensor:
#
