# Modified to work with idf fork version!!!
substitutions:
  name: "vista-ecp-idf" #unique network name, system name
  friendlyName: "Vista Alarm"  #used as the friendly name of your application in HomeAssistant
  panelId: "VistaAlarm"         #used as the service variable name.
  accesscode: !secret access_code
  
vista_alarm_panel:
  id: $panelId
  access_code: $accesscode #Only comes into effect if needed for arming and quickarm is not set

  default_partition: "1" #set to your main partition
  debug_logging: "false"  #enables additional bus activity logging and prints full ecp packet contents to the log.  Global esphome and vista-alarm  
                          #component (if configured) logging level must be set to DEBUG or higher in logging component section
                          #to output all messages. 
  debug_pulsing: "false" #enables use of ESP32 RMT peripheral to capture and output pulse pattern for diagnostics.  Pulse pattern output to log commences 
                         # 60 seconds after startup and continues indefinitely.  DO NOT enable for routine use of component! 

  #assign a new virtual keypad address to each active partition using programs *190 - *196
  #and enter it below.  For unused partitions, use 0 as the keypad address.
  keypad_addr_1: "20" #partition 1 virtual keyapd
  keypad_addr_2: "0" #partition 2 virtual keypad. set to 0 to disable
  keypad_addr_3: "0" #partition 3 virtual keypad. set to 0 to disable

  # AUI address from program field *189 to use for faster zone closure status for zones directly
  # hardwired to the panel and to allow time sync of panel via manual Home Assistant service. 
  # Ensure it is not assigned to a physical touchpad or to Total Connect 2.0 (assigned to address 2).
  #        Note: Older vista20 panel firmwares only have addresses 1 and 2 while newer will have 1,2,5 and 6. 
  # For Vista128,Vista250 commercial panels, ensure the address used is setup as an AUI keypad in program #93, 
  # device programming. Omission of the parameter or a value of zero disables AUI handling.
  aui_addr: "0" 

  rx_pin: "21" #GPIO pin to use for data receive (yellow line) 
  tx_pin: "23" #GPIO pin to use for data transmit (green line)
  uart_1: "1" #Hardware UART number to use for tx/rx.

  monitor_pin: "22" #GPIO pin to use for monitoring module traffic such as RF or Expanders . Set to -1 to disable.
  uart_2: "2" #Hardware UART number to use for monitoring module traffic via monitorpin.  Automatically disabled if monitorpin set to -1.

  ttl: "30"  # time to live in seconds for zone/fire status before expiring
  quickarm: "false"

  lrr_supervisor: "false" # set to true if we don't have an LRR monitoring supervisor and we can emulate one to get the statuses

  rf_receiver_emulation: "false" # set to true if using emulated RF sensors
  rf_receiver_addr: "0"  

  clean_build: "false" #default is false.  only set to true if getting duplication errors in linking step. Once you compile, reset it back to false.  

#location of alarm panel code.  You can use the github release version  or 
#copy the code to directory "my_components" in your main esphome directory
# see here for more info: https://esphome.io/components/external_components    
external_components:
  - source: github://pletch/esphome-vistaECP-idf
  #- source:  components #uncomment to use local directory  
    components: [vista_alarm_panel] 
    refresh: 10min

esphome:
  name: $name
  friendly_name: $friendlyName

esp32:
  board: esp-wrover-kit
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

time:
  - platform: homeassistant
  
# Enable logging
logger:
  baud_rate: 115200   
  level: DEBUG
  logs:
    vista-alarm: DEBUG    #set this as desired to suppress/enable log messages for vista-alarm component

safe_mode: 

ota:
  platform: esphome

api:
  port: 6053
  custom_services: true

######################################################################## 
# Edit binary and text sensors below to suit your alarm setup.
# You can safely add or remove any sensor as needed.
# 
# Examples are provided for both hardwired and RF zones.
#  
# Enroll your RF serial devices using the rf_serial and rf_loop parameters.
# For most devices loop1 is used such as 5800pir, other devices such as 5816 will use loop2.  
# Please refer to your RF device programming (*56 program) to see what 
# loop and zones are assigned to your RF devices.  
#
# !!Do not include leading zeros in rf_serial!!
#
# You can refer to the pdf link below for more details on loop numbers 
# https://advancedsecurityllc.com/wp-content/uploads/5800%20Wireless%20Device%20List.pdf
#
# Zone emulation for either hardwired or RF sensors is enabled   
# with the use of the option emulation: true in binary zone configuration.
#
# Hardwired zone emulation facilitated via automatic expander board emulation (e.g. Honeywell 4129).
# Ensure that the zone number selected for emulated zone does not conflict with 
# existing physical boards in your system. 
#
# Emulated zones 9-16 will enable expander emulation on address 7.
# Emulated zones 17-24 will enable expander emulation on address 8.
# Emulated zones 25-32 will enable expander emulation on address 9.
# Emulated zones 33-40 will enable expander emulation on address 10.
# Emulated zones 41-48 will enable expander emulation on address 11.
#
# RF zone emulation faciliated via automatic Radio Frequency Receiver emulation (5881ENH).
# Ensure a physical RF receiver is not already present as Vista systems only support a 
# single RF receiver.  To use, must also set rf_receiver_emulation to 'true' above.
# Refer to manual for possible addresses to assign to emulated receiver.
# 
#######################################################################

