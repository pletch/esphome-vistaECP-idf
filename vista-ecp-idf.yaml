#########################################################################
# Zone text sensors can be specified to include alternative zone status as 
# a text sensor using type: zone. Output values: (O=open, B=bypass,T=trbl or check,A=alarm)
# Other general text sensors are available.
# type:
#    lrr_messages = long range radio messages
#    rf_messages = rf messages
#    line1 = keypad prompt line 1 displayed messages
#    line2 = keypad prompt line 2 displayed messages
#    zone_status = combined status for zones with messages
#    beeps = beeps output
# 
# Text sensors with partition specific data will require specifying partition:
#### text sensors ####
text_sensor:

#
#  - platform: vista_alarm_panel
#    name: "Kitchen Motion Txt"
#    id: z13_txt
#    type: "zone"
#    zone: 13
#    partition: 1

# system status messages  
  - platform: vista_alarm_panel
    id: ss_1  
    name: "System Status"
    icon: "mdi:shield"
    type: "system_status"
    partition: 1
# sample filter to change "not_ready" status to "disarmed" for use in HA Alarm Panel
#    filters:
#      - lambda: |-
#          if (x == "not_ready") x="disarmed";
#          return x;

# long range radio messages
  - platform: vista_alarm_panel
    id: lrr  
    name: "Lrr Msg"
    type: "lrr_messages"
    icon: "mdi:alert-box"

# RF zone messages 
  - platform: vista_alarm_panel
    id: rf  
    name: "RF Msg"
    type: "rf_messages"
    icon: "mdi:alert-box"    

# virtual lcd keypad line1 and line2 messages for each partition   
  - platform: vista_alarm_panel
    name: "Line1"
    id: ln1_1
    partition: 1
    type: "line1"    
  - platform: vista_alarm_panel
    name: "Line2"
    id: ln2_1
    partition: 1
    type: "line2"    

# zone status messages bypas/open/alarm
  - platform: vista_alarm_panel
    name: "Zone Status" 
    id: zs
    type: "zone_status"

# system beeps   
  - platform: vista_alarm_panel
    name: "Beeps"  
    id: bp_1
    partition: 1
    type: "beeps"
    
