substitutions:
  name: "vista-ecp-idf" #unique network name, system name
  friendlyName: "Vista Alarm"  #used as the friendly name of your application in HomeAssistant
  panelId: "VistaAlarm"         #used as the service variable name.
  accesscode: !secret access_code
  
vista_alarm_panel:
  id: $panelId
  accesscode: $accesscode #Only comes into effect if needed for arming and quickarm is not set
  maxzones: "48" #maximum amount of zones that your panel supports
  maxpartitions: "1" #maximum amount of partitions that your panel supports
 
  defaultpartition: "1" #set to your main partition
  vistadebuglevel: "3" #component debug level for messages

  #assign a new virtual keypad address to each active partition using programs *190 - *196
  #and enter it below.  For unused partitions, use 0 as the keypad address.
  keypadaddr1: "20" #partition 1 virtual keyapd
  keypadaddr2: "0" #partition 2 virtual keypad. set to 0 to disable
  keypadaddr3: "0" #partition 3 virtual keypad. set to 0 to disable

  #AUI address from program field *189 to use for zone status queries (open/close and bypass). 
  #Ensure it is not assigned to a real keypad or to Total Connect 2.0. For those panels, you can select auiaddr: 5 or 6.
  #As a final option, you can assign it to the same address as your existing AUI display address of 1
  #Note: Older vista20 panels only have addresses 1 and 2 while newer will have 1,2,5 and 6. For Vista128,Vista250 commercial panels, ensure the address used is setup as an AUI keypad in program #93, device programming
  
  auiaddr: "0" #use auiaddr: 5 or 6 if you already have address 2 assigned to Total Connect or another keypad
 
  ##esp32
  rxpin: "21" #GPIO pin to use for data receive (yellow line) 
  txpin: "23" #GPIO pin to use for data transmit (green line)
  uart1: "1" #Hardware UART number to use for tx/rx.

  monitorpin: "22" #GPIO pin to use for monitoring module traffic such as RF or Expanders . Set to -1 to disable.
  uart2: "2" #Hardware UART number to use for monitoring module traffic via monitorpin.  Automatically disabled if monitorpin set to -1.

  ttl: "30000"  # time  to live  in ms for zone/fire status before expiring;
  quickarm: "false"
  lrrsupervisor: "false" # set to true if we don't have an LRR monitoring supervisor so we can emulate one to get the statuses. 

  clean_build: "false" #default is false.  only set to true if getting duplication errors in linking step. Once you compile, reset it back to false.  

#location of alarm panel code.  You can use the github release version  or 
#copy the code to directory "my_components" in your main esphome directory
# see here for more info: https://esphome.io/components/external_components    
external_components:
  #- source: github://Dilbert66/esphome-components@dev #uncomment to use github repository
  - source: github://pletch/esphome-vistaECP-idf
  #- source:  components #uncomment to use local directory  
    components: [vista_alarm_panel] 
    refresh: 10min

esphome:
  name: $name
  friendly_name: $friendlyName
#Example of how to set the panel time from the esp time on bootup  
  #on_boot:
    #priority: 600
    #then:
      #- lambda: |-
         #   $panelId->set_panel_time();  
esp32:
  board: esp-wrover-kit
  variant: esp32
  framework:
    version: 5.3.1
    platform_version: 6.9.0
    sdkconfig_options: {"CONFIG_FREERTOS_HZ":"1000","CONFIG_ESP_TIMER_SUPPORTS_ISR_DISPATCH_METHOD":"y"}
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

time:
  - platform: homeassistant
  
# Enable logging
logger:
  baud_rate: 115200
  level: DEBUG
  #baud_rate: 0

safe_mode: 

ota:
  platform: esphome

api:
  port: 6053

######################################################################## 
# Edit binary and text sensors below to suit your alarm setup.
# You can safely add or remove any sensor as needed.
# 
# Examples are provided for both hardwired and RF zones.
#  
# Enroll your RF serial devices using the rf_serial and rf_loop parameters.
# For most devices loop1 is used such as 5800pir, other devices such as 5816 will use loop2.  
# Please refer to your RF device programming (*56 program) to see what 
# loop and zones are assigned to your RF devices.  
#
# !!Do not include leading zeros in rf_serial!!
#
# You can refer to the pdf link below for more details on loop numbers 
# https://advancedsecurityllc.com/wp-content/uploads/5800%20Wireless%20Device%20List.pdf
#
# Zone emulation through automatic expander board emulation (e.g. Honeywell 4129) is 
# possible with the use of the option emulation: true in binary zone configuration.  
# Ensure that the zone number selected for emulated zone does not conflict with 
# existing physical boards in your system. 
#
# Emulated zones 9-16 will enable expander emulation on address 7.
# Emulated zones 17-24 will enable expander emulation on address 8.
# Emulated zones 25-32 will enable expander emulation on address 9.
# Emulated zones 33-40 will enable expander emulation on address 10.
# Emulated zones 41-48 will enable expander emulation on address 11.
# 
#######################################################################

