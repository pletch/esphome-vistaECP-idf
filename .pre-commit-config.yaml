---
# Mirrored from ESPHome upstream (https://github.com/esphome/esphome/blob/dev/.pre-commit-config.yaml).
#
# Deviations from upstream, all of them forced by this being an external
# component rather than the ESPHome repository itself:
#   * file filters point at components/ instead of esphome/ and tests/
#   * the "no-commit-to-branch" hook is dropped (it guards dev/release/beta)
#   * the local "ci-custom" hook is dropped (it lives in ESPHome's script/ dir)
#   * flake8 + flake8-docstrings are dropped: upstream scopes them to its own
#     tree, and their docstring rules do not suit config-validation modules
#   * pylint runs from its own pre-commit repo with esphome as an explicit
#     dependency, since ESPHome's script/run-in-env.py is not available here
#
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py312-plus]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        exclude: ^(\.clang-format|\.clang-tidy)$
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v13.0.1
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.7
    hooks:
      - id: pylint
        files: ^components/.+\.py$
        # esphome must be importable or every codegen import reports import-error
        additional_dependencies:
          - esphome==2026.8.1
